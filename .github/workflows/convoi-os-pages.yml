name: Deploy Convoi OS Proposal to GitHub Pages

on:
  push:
    branches: [cursor/convoi-os-pilot-proposal-f642, main]
    paths:
      - 'convoi-os-proposal/**'
      - '.github/workflows/convoi-os-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-convoi-os
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: convoi-os-proposal

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
